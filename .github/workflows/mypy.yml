name: Mypy Type Check

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  mypy:
    name: mypy – static type checking
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mypy-${{ hashFiles('requirements-dev.txt', 'common_requirements/py3.11.txt', 'workers/*/requirements/py3.11.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-mypy-
            ${{ runner.os }}-pip-

      # ── System deps (needed so google-cloud wheels install cleanly) ────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential

      # ── Python dependencies ───────────────────────────────────────────────
      - name: Install common requirements
        run: pip install --no-cache-dir -r common_requirements/py3.11.txt

      - name: Install worker requirements
        run: |
          pip install --no-cache-dir -r workers/face_encoding_worker/requirements/py3.11.txt
          pip install --no-cache-dir -r workers/face_verification_worker/requirements/py3.11.txt
          pip install --no-cache-dir -r workers/onboarding_verification_worker/requirements/py3.11.txt

      - name: Install dev / type-stub dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      # ── Run mypy ──────────────────────────────────────────────────────────
      - name: Run mypy
        run: python -m mypy

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Mypy Type Check" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m mypy 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
