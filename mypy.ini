[mypy]
# ── Scope ─────────────────────────────────────────────────────────────────────
# Check production source only; exclude local dev scripts, entry-points,
# generated code, virtual envs, and the test suite.
files = common, workers
exclude = (?x)(
    (^|/)local_testing/         # local dev / seeding scripts
    |(^|/)main\.py$             # worker entry-points (pydantic _env_file runtime arg)
    |(^|/)venv3?[-\w]*/         # per-worker virtual environments
    |(^|/)venv/                 # project-level venv
    |(^|/)\.venv/               # project-level .venv
    |(^|/)tests/                # test suite
    |(^|/)pbgen/                # generated protobuf stubs
  )

# ── Resolution ────────────────────────────────────────────────────────────────
# Use explicit package bases so mypy maps `common/` → `common` and
# `workers/` → `workers` without duplicate-module errors.
explicit_package_bases = True
mypy_path = .

# ── Missing stubs ─────────────────────────────────────────────────────────────
# Third-party packages without bundled stubs (google-cloud, cv2, sklearn, …)
# are silenced here; stubs are installed where available (types-requests).
ignore_missing_imports = True

# ── Strictness ────────────────────────────────────────────────────────────────
# Catch real bugs without being overly restrictive on an existing codebase.
warn_return_any          = False
warn_unused_ignores      = True
warn_redundant_casts     = True
disallow_untyped_defs    = False
disallow_incomplete_defs = False
check_untyped_defs       = True
no_implicit_optional     = True
strict_optional          = True

# ── Output ────────────────────────────────────────────────────────────────────
show_error_codes   = True
pretty             = False
error_summary      = True

# ── Per-module overrides ──────────────────────────────────────────────────────
# Silence known third-party modules that lack stubs entirely.
[mypy-cv2.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-grpc.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True
